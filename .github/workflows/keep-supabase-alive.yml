name: Keep Supabase Alive

# Free-tier Supabase projects pause after 7 days with no requests. This makes a
# lightweight REST call every 2 days so the project stays awake. It also runs on
# demand from the Actions tab (workflow_dispatch).
#
# The values below are public by design: the project URL and the *publishable*
# (anon) key both ship in the browser bundle already, so they're safe to inline.
# Never put the service_role / secret key here.

on:
  schedule:
    - cron: '17 6 */2 * *' # 06:17 UTC, every 2 days
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: https://xshiaabalxyzwacesomx.supabase.co
          SUPABASE_ANON_KEY: sb_publishable_M_rI0lD0ef6sOT6hopSKHg_kGOHBJcH
        run: |
          echo "Pinging $SUPABASE_URL ..."
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "HTTP status: $code"
          # Any 2xx/3xx/4xx means the API answered (the project is awake).
          # Only a 5xx or no response should fail the job.
          if [ -z "$code" ] || [ "$code" -ge 500 ]; then
            echo "Supabase did not respond healthily."
            exit 1
          fi
          echo "Supabase is awake."
